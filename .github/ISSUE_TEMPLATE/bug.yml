name: Bug report
description: Report a reproducible issue
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary and reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and environment
