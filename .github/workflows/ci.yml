name: Web CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap-smoke:
    name: bootstrap-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Validate repository policy
        run: node -e "for (const f of ['AGENTS.md','CONTRIBUTING.md','SECURITY.md','README.md','CHANGELOG.md','docs/repository-audit.md']) require('node:fs').accessSync(f)"
      - name: Run bootstrap-only smoke tests
        run: node --test tests/foundation.test.mjs
      - run: echo 'Bootstrap policy tests only; no application tests or build ran.' >> "$GITHUB_STEP_SUMMARY"

  readiness:
    runs-on: ubuntu-latest
    outputs:
      product-configured: ${{ steps.project.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Next.js product CI: SKIPPED (no package.json).' >> "$GITHUB_STEP_SUMMARY"
          fi

  product-ci:
    name: web-product-ci
    needs: readiness
    if: needs.readiness.outputs.product-configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  web-e2e:
    name: web-e2e
    needs: product-ci
    runs-on: ubuntu-latest
    # Full-stack E2E: the public backend repo runs against a throwaway Postgres service.
    services:
      postgres:
        image: postgres:16.15-bookworm
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: lplatform_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d lplatform_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LPlatform/L_Platform_Backend
          ref: main
          path: backend
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Start backend API (migrate, seed, run)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/lplatform_e2e
          NODE_ENV: test
          ENABLE_DEMO_RESET: "true"
          JWT_SECRET: ci-e2e-only-jwt-secret-0123456789abcdef0123456789
          COOKIE_SECRET: ci-e2e-only-cookie-secret-0123456789abcdef012345
          CORS_ORIGIN: http://127.0.0.1:3100,http://localhost:3100
        run: |
          PNPM="npx --yes pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          $PNPM install --frozen-lockfile
          $PNPM db:migrate
          $PNPM db:seed
          $PNPM build
          nohup node dist/index.js > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3001/health >/dev/null && exit 0; sleep 1; done
          cat ../api.log
          exit 1
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      - name: Run Playwright end-to-end tests
        run: pnpm e2e
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm start --port 3100
      - name: Backend log on failure
        if: failure()
        run: cat api.log || true
