name: Web CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap-smoke:
    name: bootstrap-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Validate repository policy
        run: node -e "for (const f of ['AGENTS.md','CONTRIBUTING.md','SECURITY.md','README.md','CHANGELOG.md','docs/repository-audit.md']) require('node:fs').accessSync(f)"
      - name: Run bootstrap-only smoke tests
        run: node --test tests/foundation.test.mjs
      - run: echo 'Bootstrap policy tests only; no application tests or build ran.' >> "$GITHUB_STEP_SUMMARY"

  readiness:
    runs-on: ubuntu-latest
    outputs:
      product-configured: ${{ steps.project.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Next.js product CI: SKIPPED (no package.json).' >> "$GITHUB_STEP_SUMMARY"
          fi

  product-ci:
    name: web-product-ci
    needs: readiness
    if: needs.readiness.outputs.product-configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
