name: Prepare Staging Deployment
on:
  workflow_dispatch:
    inputs:
      artifact_digest:
        description: Immutable verified build artifact SHA-256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate deployment prerequisites
        env: { DIGEST: "${{ inputs.artifact_digest }}" }
        run: |
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo 'No hosting provider, build artifact store, or credentials are configured. Staging deployment is not active.'
          exit 1
