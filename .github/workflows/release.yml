name: Web Release
on:
  push:
    tags: ['web-v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
jobs:
  verify-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Validate version tag and main ancestry
        run: |
          [[ "$TAG" =~ ^web-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG" origin/main
      - name: Refuse an existing release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
      - name: Require an initialized Next.js project
        run: test -f package.json && test -f pnpm-lock.yaml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Upload verified production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-production-${{ github.sha }}
          path: .next/**
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-production-${{ github.sha }}
          path: release-artifact
      - name: Create immutable GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
          mapfile -t assets < <(find release-artifact -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
