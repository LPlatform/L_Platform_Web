name: Web Release
on:
  push:
    tags: ['web-v*.*.*']
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Validate version tag
        env: { TAG: '${{ github.ref_name }}' }
        run: |
          [[ "$TAG" =~ ^web-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG" origin/main
          git tag -l "$TAG" | grep -qx "$TAG"
      - name: Require package build foundation
        run: |
          if [[ ! -f package.json || ! -f pnpm-lock.yaml ]]; then
            echo 'Release blocked: package and lockfile are not configured.'
            exit 1
          fi
      - name: Build and test
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$TAG" --generate-notes --verify-tag
